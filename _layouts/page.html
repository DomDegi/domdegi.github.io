---
layout: default
---
<article class="page">
    <div class="wrapper wrapper--narrow">
        <a href="{{ '/' | relative_url }}#projects" class="back-link">&larr; Back to all projects</a>
        <h1 class="page-title">{{ page.title }}</h1>
        {% if page.tags %}
        <div class="page-meta">
            {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
        </div>
        {% endif %}
        <div class="page-body">
            {{ content }}
        </div>
    </div>
</article>
