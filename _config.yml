# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Domenico De Giorgio
tagline: Computer Engineering & HPC
author: Domenico De Giorgio
email: domenicodegiorgio@icloud.com
description: >-
  Portfolio of Domenico De Giorgio — BSc in Computer Engineering and MSc candidate in
  High Performance Computing at Politecnico di Milano. Projects in scientific computing,
  numerical methods, parallel programming and machine learning.
baseurl: ""     # lascia vuoto per user/organization site
url: "https://domdegi.github.io"
github_username:  DomDegi
linkedin_username:  domenicodegiorgio
instagram_username:  domenico.degiorgio_

# jekyll-seo-tag reads the social card from `page.image`, not a site-level key,
# so it is applied to every page through `defaults` below. `social.links`
# becomes sameAs in the JSON-LD person block.
social:
  name: Domenico De Giorgio
  links:
    - https://github.com/DomDegi
    - https://www.linkedin.com/in/domenicodegiorgio
    - https://www.instagram.com/domenico.degiorgio_

nav_links:
  - name: Projects
    anchor: "#projects"
  - name: Skills
    anchor: "#skills"
  - name: CV
    anchor: "#cv"

# Build settings
# theme: minima
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".

include:
  - _pages

# Additive to Jekyll's built-in exclude list. These are repo docs, not pages —
# without this they are served at /CLAUDE.md and /README.md.
exclude:
  - CLAUDE.md
  - README.md

#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

collections:
  projects:
    output: true

# Gives every page the 1200x630 social card. jekyll-seo-tag turns an image with
# width/height/alt into og:image + twitter:image and their metadata, and switches
# twitter:card to summary_large_image on its own once an image is present.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/social-card.png
        width: 1200
        height: 630
        alt: "Domenico De Giorgio — MSc candidate in High Performance Computing at Politecnico di Milano"
