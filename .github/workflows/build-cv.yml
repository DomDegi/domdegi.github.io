# Compiles cv/cv.tex and commits the PDF into assets/docs/.
#
# This workflow deliberately does NOT build or deploy the site: GitHub Pages
# still runs its own default Jekyll build from the branch. All this does is
# keep the published PDF in step with the LaTeX source.
name: Build CV

on:
  push:
    branches: [main]
    paths:
      - "cv/**"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile the CV
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: cv
          root_file: cv.tex
          # Pin the timestamp to the commit so an unchanged source produces an
          # identical PDF instead of a fresh one on every run.
          latexmk_use_lualatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at }}
          FORCE_SOURCE_DATE: 1

      - name: Publish the PDF into the site
        run: |
          mkdir -p assets/docs
          mv cv/cv.pdf assets/docs/cv_domenico_degiorgio.pdf

      - name: Commit it if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/docs/cv_domenico_degiorgio.pdf; then
            echo "PDF unchanged, nothing to commit."
          else
            git add assets/docs/cv_domenico_degiorgio.pdf
            git commit -m "Rebuild the CV PDF from cv/cv.tex"
            git push
          fi
